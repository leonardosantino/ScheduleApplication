  schedule_database:
    container_name: schedule_database
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: schedule
      MONGO_INITDB_ROOT_USERNAME: local
      MONGO_INITDB_ROOT_PASSWORD: XaY2cMuXdJ4I7aJA
    volumes:
      - schedule_database_data:/data/db

volumes:
  schedule_database_data:
    name: schedule_database_data

networks:
  default:
    name: schedule_default